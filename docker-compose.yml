services:
    caddy:
        image: 'caddy:alpine'
        volumes:
            - type: volume
              source: /src/index.html
              target: /srv/index.html
            - type: volume
              source: /src/Caddyfile
              target: /etc/caddy/Caddyfile
        #     - caddy_data:/data
        #     - $PWD/site:/srv
        #     - caddy_config:/config
        cap_add:
            - NET_ADMIN
        ports:
            - target: 80
              published: 80
              protocol: tcp
              mode: ingress
            - target: 443
              published: 443
              protocol: tcp
              mode: ingress
            - target: 443
              published: 443
              protocol: udp
              mode: ingress
        deploy:
            replicas: 2
            placement:
                constraints:
                    - node.role == worker
            resources:
                limits:
                    cpus: '0.5'
                    memory: 500M
            restart_policy:
                condition: any
        # extends: shared

    helloworld:
        #image: "crccheck/hello-world:v1.0.0"
        #ports:
        #- "80:8000"
        image: 'nginxdemos/nginx-hello:0.3'
        #ports:
        #  - "80:8080"
        ports:
            - target: 8080
              published: 8080
              protocol: tcp
              mode: ingress
        deploy:
            replicas: 2
            placement:
                constraints:
                    - node.role == worker
            resources:
                limits:
                    cpus: '0.5'
                    memory: 500M
            restart_policy:
                condition: any
        # extends: shared

    # shared:
